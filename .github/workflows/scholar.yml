name: Update Google Scholar Stats

on:
  schedule:
    - cron: "0 0 * * *" # Run daily at midnight UTC
  workflow_dispatch: # Allow manual trigger from the UI

permissions:
  contents: write

concurrency:
  group: scholar-snapshot
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check snapshot failure handling
        run: python -m unittest discover -s test -p 'test_scholar_snapshot.py'

      - name: Run scholar stats updater
        run: python bin/update_scholar_stats.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/scholar_stats.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Automated update of Google Scholar metrics"
          git push

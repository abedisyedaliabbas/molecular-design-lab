name: Render a CV
on:
  push:
    branches: [main, master]
    paths:
      - "_data/cv.yml"
      - "_data/research.yml"
      - "bin/build_cv_pdf.py"
      - ".github/workflows/render-cv.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-cv
  cancel-in-progress: false
jobs:
  rendercv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF dependencies
        run: pip install reportlab PyYAML
      - name: Generate the research CV
        run: python bin/build_cv_pdf.py
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: research-cv
          path: assets/pdf/cv.pdf
      - name: Save updated CV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/pdf/cv.pdf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update research CV PDF"
          git pull --rebase
          git push

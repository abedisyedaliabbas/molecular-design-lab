intro: I study what molecules do after they absorb light—and how to use that knowledge to design better ones.
summary: I connect excited-state quantum chemistry with the design of fluorophores and photofunctional materials. Now, as a Research Fellow at NUS I-FIM, I work on delta machine learning within the NRF Materials Data Foundry project.
directions:
  - title: Understand the mechanism
    label: Excited-state photophysics
    text: Resolve how molecular structure and conformation govern emission, electron transfer, and non-radiative decay.
    methods: DFT / TD-DFT · CASSCF / CASPT2 · Nonadiabatic dynamics
    evidence: First-author work on restricted TICT and aggregation-induced emission.
    publication: pub35
  - title: Design for function
    label: Fluorophores & photostability
    text: Translate photophysical mechanisms into design principles for imaging probes, photoswitches, and photoactive materials.
    methods: PET · TICT · ESIPT · Structure–property relationships
    evidence: Collaborative studies in Nature Methods, Nature Communications, and Angewandte Chemie.
    publication: pub4
  - title: Learn across fidelities
    label: Current work · Materials Data Foundry
    text: Work on delta machine learning for materials discovery, connecting predictions across different levels of theory.
    methods: Delta learning · Multi-fidelity ML · Python · HPC
    evidence: NRF Materials Data Foundry project at NUS I-FIM.
    url: https://ifim.nus.edu.sg/people/syed-ali-abbas-abedi/
